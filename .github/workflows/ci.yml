name: macOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift style
        run: >-
          xcrun swift-format lint --strict --recursive
          Package.swift Sources Tekmor Tests Design
      - name: Test Swift core
        run: swift test
      - name: Build Tekmor.app
        run: >-
          xcodebuild -project Tekmor.xcodeproj -scheme Tekmor -configuration Debug
          -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode -disableAutomaticPackageResolution -skipPackagePluginValidation build
